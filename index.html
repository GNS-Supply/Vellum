<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento</title>
<meta name="theme-color" content="#23395b"><link rel="icon" id="fav" href="data:,"><link rel="apple-touch-icon" id="ati" href="data:,"><link rel="manifest" id="mf">
<link rel="stylesheet" href="style.css?v=10"><script type="module" src="app.js?v=10"></script></head>
<body><div class="pole" aria-hidden="true"></div><header class="topo" id="topo"></header>
<main class="wrap" id="main" tabindex="-1"><div id="boot"><div class="skel"></div><p class="mute">Carregando… Se esta mensagem não sumir, os arquivos css/style.css e js/app.js não foram encontrados ou o JavaScript falhou. Pressione F12 e veja as abas Console e Rede.</p></div></main><div id="toasts" aria-live="polite"></div>
<template id="t-index"><section class="hero" id="hero"><div class="skel"></div></section></template>
<template id="t-login"><section class="card auth"><h1>Entrar</h1><form id="f" novalidate><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button class="btn">Entrar</button></form><button class="btn ghost" id="g" type="button">Continuar com Google</button><p class="mute"><a href="#" id="rec">Esqueci a senha</a> · <a data-l="cadastro.html">Criar conta</a></p></section></template>
<template id="t-cadastro"><section class="card auth"><h1>Criar conta</h1><form id="f"><label>Nome<input name="nome" autocomplete="name" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="senha" type="password" minlength="6" autocomplete="new-password" required></label><label><input type="checkbox" name="lgpd">Aceito que meus dados sejam usados para agendamentos e atendimento.</label><button class="btn">Criar conta</button></form><button class="btn ghost" id="g" type="button">Continuar com Google</button><p class="mute">Já tem conta? <a data-l="login.html">Entrar</a></p></section></template>
<template id="t-cliente"><h1>Meu perfil</h1><div class="skel" id="carga"></div><form id="f" class="card" hidden><p class="mute">Todos os campos são opcionais. Você pode alterar ou apagar quando quiser.</p><div class="cols"><label>Nome<input name="nome"></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel"></label><label>Nascimento<input name="nascimento" type="date"></label><label>CPF<input name="cpf" inputmode="numeric"></label><label>CEP<input name="cep" inputmode="numeric" autocomplete="postal-code"></label><label>Endereço<input name="endereco" autocomplete="street-address"></label></div><label>Estilos e preferências<textarea name="estilo" rows="3" placeholder="Ex.: degradê baixo, barba alinhada, sem máquina na tesoura"></textarea></label><button class="btn">Salvar perfil</button></form></template>
<template id="t-agendar"><h1>Agendar horário</h1><div id="avisos"></div><div id="fid"></div><div id="indic"></div><br><div id="app"><div class="skel"></div></div><h2 style="margin-top:2rem">Meus agendamentos</h2><ul class="lista card" id="meus"></ul></template>
<template id="t-agendamentos"><div class="pg-head"><h1 id="dtit">Agenda</h1><div class="dnav"><button class="ibtn" id="dprev" type="button" aria-label="Dia anterior"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><button class="btn ghost sm" id="dhoje" type="button">Hoje</button><button class="ibtn" id="dnext" type="button" aria-label="Próximo dia"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><input id="d" type="date" aria-label="Escolher o dia"></div></div><div class="kpis" id="resumo"></div><ul class="lista card agenda" id="lista"></ul></template>
<template id="t-unidades"><h1 id="tit"></h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-profissionais"><h1 id="tit"></h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-servicos"><h1 id="tit"></h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-personalizacao"><h1>Aparência</h1><p class="lead">Somente o Master edita. A prévia é ao vivo; salve para publicar.</p><label>Estabelecimento<select id="lojas"></select></label><div class="skel" id="carga"></div><div class="pers"><form id="f" class="card" hidden><h2>Identidade</h2><div class="cols"><label>Nome<input name="nome" required></label><label>Cor principal<input name="cor" type="color"></label>
<label>Tema<select name="tema"><option value="claro">Claro</option><option value="escuro">Escuro</option><option value="argila">Argila (tom médio quente)</option><option value="nevoa">Névoa (tom médio frio)</option></select></label>
<label>Formato dos componentes<select name="estilo"><option value="reto">Reto</option><option value="discreto">Discreto</option><option value="suave">Suave</option><option value="redondo">Arredondado</option><option value="capsula">Cápsula</option></select></label>
<label>Fonte<select name="fonte"><option value="classica">Clássica (Playfair)</option><option value="moderna">Moderna (Inter)</option><option value="editorial">Editorial (DM Serif)</option><option value="industrial">Industrial (Oswald)</option><option value="geometrica">Geométrica (Syne)</option><option value="artesanal">Artesanal (Fraunces)</option></select></label>
<label>Fundo<select name="fundo"><option value="">Liso</option><option value="linhas">Linhas diagonais</option><option value="grade">Grade</option><option value="pontos">Pontilhado</option><option value="sombreado">Sombreado de tatuagem</option><option value="losangos">Losangos</option><option value="hachura">Hachura</option></select></label></div>
<label>Descrição<textarea name="descricao" rows="2"></textarea></label>
<h2>Logo</h2><div class="cols"><label>Arquivo (PNG sem fundo)<input name="logo" type="file" accept="image/*"></label><label>Tamanho<input name="logoTam" type="range" min="24" max="160" value="36"></label>
<label>Posição<select name="logoPos"><option value="lado">Ao lado do nome</option><option value="centro">Centralizada sobre o nome</option><option value="so">Somente a logo</option><option value="hero">Grande na tela inicial</option><option value="marca">Marca d'água</option></select></label>
<label>Moldura<select name="logoForma"><option value="livre">Livre</option><option value="circulo">Círculo</option><option value="arco">Arco</option><option value="quadrado">Quadrado</option><option value="selo">Selo colorido</option></select></label></div>
<h2>Acabamento</h2><div class="cols"><label>Espessura da borda<input name="borda" type="range" min="0" max="3" step=".5" value="1"></label><label>Opacidade dos blocos<input name="opac" type="range" min="55" max="100" value="100"></label>
<label>Profundidade<select name="prof"><option value="0">Plana</option><option value="1">Filete</option><option value="2">Suave</option><option value="3">Elevada</option></select></label><label>Brilho das imagens<input name="brilho" type="range" min="80" max="120" value="100"></label></div>
<h2>Fotos dos profissionais, datas e horários</h2><div class="cols"><label>Exibição dos profissionais<select name="fotoLayout"><option value="grade">Grade</option><option value="tilt">Cartões 3D com inclinação</option><option value="coverflow">Carrossel 3D</option><option value="pilha">Pilha de cartas</option></select></label><label>Forma da foto<select name="fotoForma"><option value="arco">Arco</option><option value="circulo">Círculo</option><option value="oval">Oval</option><option value="retrato">Retrato suave</option><option value="folha">Folha</option><option value="polaroid">Polaroid</option></select></label>
<label>Efeito ao selecionar<select name="fotoEfeito"><option value="contorno">Contorno com selo</option><option value="pb">Preto e branco para cor</option><option value="elevar">Elevação</option><option value="tinta">Tinta da marca</option><option value="moldura">Moldura interna</option><option value="foco">Foco (desfoca os demais)</option></select></label>
<label>Seleção de data<select name="dataModelo"><option value="faixa">Faixa deslizante</option><option value="calendario">Calendário</option><option value="lista">Lista de dias</option><option value="destaque">Cartões em destaque</option><option value="etiquetas">Etiquetas</option></select></label>
<label>Seleção de horário<select name="horaModelo"><option value="pilulas">Pílulas</option><option value="grade">Grade</option><option value="periodos">Por período</option><option value="lista">Lista</option><option value="trilho">Trilho horizontal</option></select></label></div>
<h2>Tela inicial</h2><label>Composição<select name="layout"><option value="cinema">Cinema (capa em tela cheia)</option><option value="mosaico">Mosaico</option><option value="editorial">Editorial (texto fixo, fotos rolando)</option><option value="coverflow">Carrossel 3D de fotos</option><option value="revista">Revista (fotos em camadas ao rolar)</option></select></label>
<div class="cols"><label>Escurecer a capa<input name="heroOverlay" type="range" min="0" max="70" value="40"></label><label>Profissionais na tela inicial<select name="homeEquipe"><option value="nao">Ocultar</option><option value="sim">Exibir</option></select></label><label>Modelo da equipe<select name="equipeModelo"><option value="grade">Grade</option><option value="fileira">Fileira sobreposta</option><option value="coverflow">Carrossel 3D</option></select></label><label>Forma<select name="equipeForma"><option value="arco">Arco</option><option value="circulo">Círculo</option><option value="oval">Oval</option><option value="retrato">Retrato</option><option value="folha">Folha</option><option value="quadrado">Quadrado</option></select></label><label>Tamanho<select name="equipeTam"><option value="p">Pequeno</option><option value="m">Médio</option><option value="g">Grande</option></select></label><label>Efeito<select name="equipeEfeito"><option value="tilt">Inclinação 3D</option><option value="cor">Cor ao passar o mouse</option><option value="zoom">Zoom</option><option value="nenhum">Nenhum</option></select></label></div><div class="cols"><label>Tipo da foto<select name="tipo"><option value="capa">Capa</option><option value="fachada">Fachada</option><option value="ambiente">Ambiente</option><option value="equipe">Equipe</option><option value="servicos">Serviços realizados</option></select></label><label>Legenda<input name="legenda"></label><label>Fotos<input name="fotos" type="file" accept="image/*" multiple></label></div>
<button class="btn ghost" type="button" id="addfoto">Adicionar à vitrine</button><div class="gal" id="gal"></div>
<p><button class="btn" type="submit">Salvar aparência</button> <button class="btn ghost" type="button" id="descartar">Descartar</button></p></form><aside class="card prev" id="prev" hidden><div class="pbar"><strong class="ptit">Pré-visualização</strong>
<span class="pctl"><select id="vmodo" aria-label="Visão"><option value="cliente">Cliente</option><option value="loja">Loja</option></select><select id="vtela" aria-label="Tela"></select><select id="vdisp" aria-label="Dispositivo"><option value="390">Celular</option><option value="820">Tablet</option><option value="100%">Computador</option></select></span>
<span class="pbt"><button class="ibtn" id="vcheia" type="button" title="Tela cheia" aria-label="Visualizar em tela cheia"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<a class="ibtn" id="vabrir" target="_blank" rel="noopener" title="Abrir em nova aba" aria-label="Abrir em nova aba"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
<button class="ibtn" id="vsair" type="button" hidden aria-label="Voltar para a edição"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Editar</button></span></div>
<div class="frame"><iframe id="vif" title="Pré-visualização"></iframe></div></aside></div></template>
<template id="t-master"><h1>Plataforma</h1><div class="cols"><section class="card"><h2>Estabelecimentos</h2><div class="skel" id="carga"></div><ul class="lista" id="lista"></ul></section><div><form class="card" id="nova"><h2>Novo estabelecimento</h2><label>Nome<input name="nome" required></label><label>Endereço (id)<input name="id_" placeholder="barbearia-do-ze" required></label><label>Cor principal<input name="cor" type="color" value="#23395b"></label><button class="btn">Criar</button></form><br><form class="card" id="dono"><h2>Vincular proprietário</h2><label>Estabelecimento<select id="sel"></select></label><label>E-mail da conta<input name="email" type="email" required></label><button class="btn">Vincular</button></form></div></div></template>
<template id="t-avaliacoes"><h1>Avaliações</h1><p class="lead" id="media"></p><ul class="lista card" id="lista"></ul></template>
<template id="t-indicadores"><h1>Indicadores</h1><div class="cols"><label>De<input id="de" type="date"></label><label>Até<input id="ate" type="date"></label></div><p><button class="btn ghost" id="csv">Exportar CSV</button></p><div class="cols" id="kpis"></div><div class="cols"><div class="card"><div id="c1" class="graf"></div></div><div class="card"><div id="c2" class="graf"></div></div></div><section class="card" style="margin-top:1rem"><h2>Profissionais e comissões</h2><ul class="lista" id="prof"></ul></section></template>
<template id="t-ajustes"><h1>Ajustes da loja</h1><div class="cols"><form class="card" id="fid"><h2>Programa de fidelidade</h2><p class="mute">Quando ativo, o cliente acompanha o progresso e ganha um brinde automático.</p><label><input type="checkbox" name="ativo">Ativar para os clientes</label><label>Brinde a cada quantos atendimentos concluídos<input name="meta" type="number" min="2" value="10"></label><label>Nome do brinde<input name="brinde" maxlength="40" placeholder="Ex.: corte grátis"></label><button class="btn">Salvar</button></form>
<form class="card" id="ind"><h2>Indicação de amigos</h2><p class="mute">O cliente que indicar ganha carimbos quando o indicado concluir o primeiro atendimento.</p><label><input type="checkbox" name="ativo">Ativar indicações</label><label>Carimbos de bônus para quem indica<input name="bonus" type="number" min="1" value="1"></label><button class="btn">Salvar</button></form><form class="card" id="txt"><h2>Textos do agendamento</h2><p class="mute">Personalize a pergunta de cada etapa. Em branco, vale o texto padrão.</p><label>Etapa da unidade<input name="tu" maxlength="60"></label><label>Etapa do profissional<input name="tp" maxlength="60"></label><label>Etapa do serviço<input name="ts" maxlength="60"></label><label>Etapa da data<input name="td" maxlength="60"></label><label>Etapa do horário<input name="th" maxlength="60"></label><button class="btn">Salvar</button></form></div></template>
<template id="t-bloqueios"><h1>Bloqueios de agenda</h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"><h2>Novo bloqueio</h2><label>Unidade<select name="unidadeId"></select></label><label>Profissional<select name="profId"></select></label><div class="cols"><label>Data<input name="data" type="date" required></label><label>Até (opcional)<input name="fim" type="date"></label></div><label><input type="checkbox" name="todo" checked>Dia inteiro</label><div class="cols"><label>Das<input name="de" type="time"></label><label>Às<input name="ate" type="time"></label></div><button class="btn">Bloquear</button></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-promocoes"><h1>Promoções e avisos</h1><div class="cols pr"><div><form class="card" id="f"><h2>Nova promoção ou cupom</h2><label>Título<input name="titulo" maxlength="60" required></label><label>Descrição<input name="descricao" maxlength="140"></label><div class="cols"><label>Tipo<select name="tipo"><option value="percent">Percentual (%)</option><option value="valor">Valor fixo (R$)</option></select></label><label>Desconto<input name="valor" type="number" min="0" step="any" required></label></div><div class="cols"><label>Código do cupom (opcional)<input name="codigo" maxlength="20"></label><label>Válida até<input name="validade" type="date"></label></div><label>Só para este cliente (e-mail, opcional)<input name="email" type="email"></label><label><input type="checkbox" name="home">Destacar na tela inicial</label><button class="btn">Criar</button></form><ul class="lista card" id="lista" style="margin-top:1rem"></ul></div>
<div><form class="card" id="fa"><h2>Novo aviso aos clientes</h2><label>Título<input name="titulo" maxlength="80" required></label><label>Mensagem<textarea name="texto" rows="3" maxlength="300" required></textarea></label><button class="btn">Publicar aviso</button></form><ul class="lista card" id="lavisos" style="margin-top:1rem"></ul></div></div></template>
<template id="t-metas"><div class="pg-head"><h1>Metas e remuneração</h1><label class="dnav">Mês<input id="mes" type="month"></label></div><div class="cols pr"><div><form class="card" id="f"><h2>Nova meta</h2><label>Quem<select name="profId"></select></label><label>Mês<input name="mes" type="month" required></label><div class="cols"><label>Faturamento (R$)<input name="valor" type="number" min="0" step="any"></label><label>Atendimentos<input name="atend" type="number" min="0"></label></div><label>Bônus ao bater a meta (R$)<input name="bonus" type="number" min="0" step="any"></label><button class="btn">Criar meta</button></form></div><div><ul class="lista card" id="lista"></ul><h2 style="margin-top:1.5rem">Remuneração do mês</h2><ul class="lista card" id="rem"></ul></div></div></template>
</body></html>
