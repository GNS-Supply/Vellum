<template id="t-cliente"><h1>Meu perfil</h1><div class="skel" id="carga"></div><form id="f" class="card" hidden><p class="mute">Todos os campos são opcionais. Você pode alterar ou apagar quando quiser.</p><div class="cols"><label>Nome<input name="nome"></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel"></label><label>Nascimento<input name="nascimento" type="date"></label><label>CPF<input name="cpf" inputmode="numeric"></label><label>CEP<input name="cep" inputmode="numeric" autocomplete="postal-code"></label><label>Endereço<input name="endereco" autocomplete="street-address"></label></div><label id="petw" hidden>Meu pet (nome, espécie, raça, porte e cuidados)<textarea name="pet" rows="2"></textarea></label><label>Estilos e preferências<textarea name="estilo" rows="3" placeholder="Ex.: degradê baixo, barba alinhada, sem máquina na tesoura"></textarea></label><button class="btn">Salvar perfil</button></form></template>

<template id="t-agendamentos"><div class="pg-head"><h1 id="dtit">Agenda</h1><div class="dnav"><button class="btn sm" id="novoag" type="button">+ Agendamento</button><button class="ibtn" id="dprev" type="button" aria-label="Dia anterior"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><button class="btn ghost sm" id="dhoje" type="button">Hoje</button><button class="ibtn" id="dnext" type="button" aria-label="Próximo dia"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><input id="d" type="date" aria-label="Escolher o dia"></div></div><div class="und" id="und" role="group" aria-label="Unidade"></div><form class="card" id="fn" hidden><h2>Novo agendamento (encaixe ou balcão)</h2><div class="cols"><label>Nome do cliente<input name="nome" required maxlength="60"></label><label>Telefone (WhatsApp)<input name="tel" type="tel"></label><label>Serviço<select name="sv"></select></label><label>Profissional<select name="pr"></select></label><label>Horário (de 30 em 30 min)<input name="hora" type="time" step="1800" required></label></div><button class="btn">Agendar</button></form><div class="kpis" id="resumo"></div><ul class="lista card agenda" id="lista"></ul><h2 id="eh" hidden style="margin-top:1.5rem">Lista de espera</h2><ul class="lista card" id="lespera" hidden></ul></template>

<template id="t-personalizacao"><div class="pg-head"><h1>Aparência</h1><label class="dnav">Loja<select id="lojas" style="width:auto;margin:0"></select></label></div><div class="skel" id="carga"></div>
<div class="studio"><div class="painel" id="painel" hidden><nav class="abas" id="abas" aria-label="Seções da aparência"><button type="button" data-aba="marca" aria-selected="false">Marca e logo</button><button type="button" data-aba="cores" aria-selected="false">Cores e tema</button><button type="button" data-aba="fundo" aria-selected="false">Fundo</button><button type="button" data-aba="formas" aria-selected="false">Formas e acabamento</button><button type="button" data-aba="tipografia" aria-selected="false">Tipografia</button><button type="button" data-aba="home" aria-selected="false">Tela inicial</button><button type="button" data-aba="vitrine" aria-selected="false">Fotos da vitrine</button><button type="button" data-aba="equipe" aria-selected="false">Equipe na tela inicial</button><button type="button" data-aba="agendamento" aria-selected="false">Tela de agendamento</button></nav>
<form id="f" class="card"><section data-aba="marca" hidden><h2>Marca e logo</h2><p class="mute">Nome, tipo de negócio e a logo do estabelecimento, no cabeçalho e na tela inicial.</p><h3>Identidade</h3><label>Nome do estabelecimento<input name="nome" required maxlength="60"></label><label>Tipo de negócio<select name="segmento"><option value="barbearia">Barbearia</option><option value="salao">Salão de beleza e estética</option><option value="clinica">Consultório e clínica</option><option value="psicologia">Psicologia e terapia</option><option value="pet">Pet shop</option></select><small class="dica">Ajusta os textos que o cliente vê.</small></label><label>Descrição curta<textarea name="descricao" rows="2" maxlength="200"></textarea></label><h3>Arquivo da logo</h3><label>Enviar logo (PNG sem fundo)<input name="logo" type="file" accept="image/*"></label><label>Moldura da logo<select name="logoForma"><option value="livre">Livre (sem moldura)</option><option value="circulo">Círculo</option><option value="arco">Arco</option><option value="quadrado">Quadrado</option><option value="selo">Selo colorido</option></select></label><h3>Logo no cabeçalho (topo de todas as telas)</h3><label>Posição<select name="logoCab"><option value="nenhuma">Não mostrar</option><option value="lado">Ao lado do nome</option><option value="centro">Centralizada sobre o nome</option><option value="so">Somente a logo</option></select></label><label>Tamanho<input name="logoTam" type="range" min="20" max="96" step="1" value="36"></label><label>Nome no cabeçalho<select name="nomeCab"><option value="sim">Mostrar</option><option value="nao">Ocultar</option></select></label><h3>Logo na tela inicial</h3><label>Posição<select name="logoHome"><option value="nenhuma">Não mostrar</option><option value="acima">Acima do título</option><option value="substitui">No lugar do título</option><option value="canto">Canto superior esquerdo</option><option value="selo">Selo circular em destaque</option><option value="dagua">Marca d’água grande ao fundo</option></select></label><label>Tamanho<input name="logoHomeTam" type="range" min="60" max="360" step="10" value="140"></label></section><section data-aba="cores" hidden><h2>Cores e tema</h2><p class="mute">A cor principal vale para botões, bordas, ícones e destaques. O tema define o tom geral das telas.</p><label>Cor principal<input name="cor" type="color"></label><label>Tema<select name="tema"><option value="claro">Claro</option><option value="escuro">Escuro</option><option value="argila">Argila (tom médio quente)</option><option value="nevoa">Névoa (tom médio frio)</option></select></label></section><section data-aba="fundo" hidden><h2>Fundo</h2><p class="mute">Textura discreta atrás de todas as telas.</p><label>Textura<select name="fundo"><option value="">Liso</option><option value="linhas">Linhas diagonais</option><option value="grade">Grade</option><option value="pontos">Pontilhado</option><option value="sombreado">Sombreado de tatuagem</option><option value="losangos">Losangos</option><option value="hachura">Hachura</option></select></label></section><section data-aba="formas" hidden><h2>Formas e acabamento</h2><p class="mute">Aparência de botões, cartões e campos.</p><label>Formato dos componentes<select name="estilo"><option value="reto">Reto</option><option value="discreto">Discreto</option><option value="suave">Suave</option><option value="redondo">Arredondado</option><option value="capsula">Cápsula</option></select></label><label>Espessura da borda<input name="borda" type="range" min="0" max="3" step="0.5" value="1"></label><label>Opacidade dos blocos<input name="opac" type="range" min="55" max="100" step="1" value="100"></label><label>Profundidade<select name="prof"><option value="0">Plana</option><option value="1">Filete</option><option value="2">Suave</option><option value="3">Elevada</option></select></label><label>Brilho das imagens<input name="brilho" type="range" min="80" max="120" step="1" value="100"></label></section><section data-aba="tipografia" hidden><h2>Tipografia</h2><p class="mute">Estilo das letras em todo o site.</p><label>Fonte<select name="fonte"><option value="classica">Clássica (Playfair)</option><option value="moderna">Moderna (Inter)</option><option value="editorial">Editorial (DM Serif)</option><option value="industrial">Industrial (Oswald)</option><option value="geometrica">Geométrica (Syne)</option><option value="artesanal">Artesanal (Fraunces)</option></select></label></section><section data-aba="home" hidden><h2>Tela inicial</h2><p class="mute">A vitrine da loja. Aqui você escolhe a composição, o visual da capa e os textos.</p><h3>Composição</h3><label>Estilo<select name="layout"><option value="cinema">Cinema — capa em tela cheia</option><option value="divisao">Divisão — texto de um lado, foto do outro</option><option value="moldura">Moldura — foto em arco com fotos ao lado</option><option value="mosaico">Mosaico — grade de fotos</option><option value="revista">Revista — fotos em camadas ao rolar</option><option value="coverflow">Carrossel 3D de fotos</option></select></label><h3>Capa</h3><label>Altura<select name="heroAltura"><option value="tela">Tela cheia</option><option value="alta">Alta</option><option value="media">Média</option></select></label><label>Borda inferior<select name="heroCurva"><option value="nenhuma">Reta</option><option value="leve">Curva leve</option><option value="forte">Curva forte</option></select></label><label>Filtro da foto<select name="heroFiltro"><option value="nenhum">Original</option><option value="pb">Preto e branco</option><option value="sepia">Sépia</option><option value="suave">Suave (menos cor)</option><option value="vivido">Vívido</option></select></label><label>Escurecer a foto de capa<input name="heroOverlay" type="range" min="0" max="70" step="1" value="40"></label><label>Movimento da capa<select name="heroAnim"><option value="zoom">Zoom lento</option><option value="paralaxe">Paralaxe ao rolar</option><option value="nenhuma">Parada</option></select></label><h3>Fotos</h3><label>Efeito ao passar o mouse<select name="fxFoto"><option value="zoom">Zoom</option><option value="cor">Cor (começa em P&B)</option><option value="elevar">Elevar</option><option value="escurecer">Escurecer</option><option value="tilt">Inclinar em 3D</option><option value="nenhum">Nenhum efeito</option></select></label><h3>Textos</h3><label>Título (vazio = nome da loja)<input name="homeTitulo" maxlength="120" placeholder=""></label><label>Subtítulo (vazio = descrição)<input name="homeSub" maxlength="120" placeholder=""></label><label>Texto do botão (vazio = padrão do tipo de negócio)<input name="ctaTexto" maxlength="120" placeholder=""></label><label>Estilo do botão<select name="ctaEstilo"><option value="solido">Preenchido</option><option value="contorno">Contorno</option></select></label><label>Título<select name="nomeHome"><option value="sim">Mostrar</option><option value="nao">Ocultar</option></select></label><label>Subtítulo<select name="subHome"><option value="sim">Mostrar</option><option value="nao">Ocultar</option></select></label><label>Tamanho do título (%)<input name="nomeTam" type="range" min="50" max="200" step="1" value="100"></label><label>Animação do título<select name="tituloAnim"><option value="nenhum">Nenhuma</option><option value="palavras">Palavra por palavra</option></select></label><label>Posição do texto<select name="textoPos"><option value="tl">Em cima, à esquerda</option><option value="tc">Em cima, centralizado</option><option value="tr">Em cima, à direita</option><option value="ml">Meio, à esquerda</option><option value="mc">Meio, centralizado</option><option value="mr">Meio, à direita</option><option value="bl">Embaixo, à esquerda</option><option value="bc">Embaixo, centralizado</option><option value="br">Embaixo, à direita</option></select></label><h3>Seções exibidas</h3><label class="ck"><input type="checkbox" name="sec" value="promo">Promoções</label><label class="ck"><input type="checkbox" name="sec" value="planos">Planos e pacotes</label><label class="ck"><input type="checkbox" name="sec" value="servicos">Lista de serviços</label><label class="ck"><input type="checkbox" name="sec" value="avaliacoes">Avaliações públicas</label><label class="ck"><input type="checkbox" name="sec" value="galeria">Faixa de fotos</label><label class="ck"><input type="checkbox" name="sec" value="cta">Chamada final para agendar</label></section><section data-aba="vitrine" hidden><h2>Fotos da vitrine</h2><p class="mute">Envie a capa e as fotos de fachada, ambientes, equipe e serviços. A primeira foto marcada como Capa vira a imagem principal.</p><label>Tipo da foto<select name="tipo"><option value="capa">Capa</option><option value="fachada">Fachada</option><option value="ambiente">Ambiente</option><option value="equipe">Equipe</option><option value="servicos">Serviços realizados</option></select></label><label>Legenda (opcional)<input name="legenda" maxlength="80"></label><label>Fotos<input name="fotos" type="file" accept="image/*" multiple></label><button class="btn ghost" type="button" id="addfoto">Adicionar à vitrine</button><div class="gal" id="gal"></div></section><section data-aba="equipe" hidden><h2>Equipe na tela inicial</h2><p class="mute">Mostra as fotos dos profissionais na tela inicial.</p><label>Exibir equipe<select name="homeEquipe"><option value="nao">Ocultar</option><option value="sim">Exibir</option></select></label><label>Modelo<select name="equipeModelo"><option value="grade">Grade</option><option value="fileira">Fileira sobreposta</option><option value="coverflow">Carrossel 3D</option></select></label><label>Forma da foto<select name="equipeForma"><option value="arco">Arco</option><option value="circulo">Círculo</option><option value="oval">Oval</option><option value="retrato">Retrato</option><option value="folha">Folha</option><option value="quadrado">Quadrado</option></select></label><label>Tamanho<select name="equipeTam"><option value="p">Pequeno</option><option value="m">Médio</option><option value="g">Grande</option></select></label><label>Efeito<select name="equipeEfeito"><option value="tilt">Inclinação 3D</option><option value="cor">Cor ao passar o mouse</option><option value="zoom">Zoom</option><option value="nenhum">Nenhum</option></select></label></section><section data-aba="agendamento" hidden><h2>Tela de agendamento</h2><p class="mute">Como o cliente escolhe profissional, data e horário.</p><label>Exibição dos profissionais<select name="fotoLayout"><option value="grade">Grade</option><option value="tilt">Cartões 3D com inclinação</option><option value="coverflow">Carrossel 3D</option><option value="pilha">Pilha de cartas</option></select></label><label>Forma da foto<select name="fotoForma"><option value="arco">Arco</option><option value="circulo">Círculo</option><option value="oval">Oval</option><option value="retrato">Retrato suave</option><option value="folha">Folha</option><option value="polaroid">Polaroid</option></select></label><label>Efeito ao selecionar<select name="fotoEfeito"><option value="contorno">Contorno com selo</option><option value="pb">Preto e branco para cor</option><option value="elevar">Elevação</option><option value="tinta">Tinta da marca</option><option value="moldura">Moldura interna</option><option value="foco">Foco (desfoca os demais)</option></select></label><label>Seleção de data<select name="dataModelo"><option value="faixa">Faixa deslizante</option><option value="calendario">Calendário</option><option value="lista">Lista de dias</option><option value="destaque">Cartões em destaque</option><option value="etiquetas">Etiquetas</option></select></label><label>Seleção de horário<select name="horaModelo"><option value="pilulas">Pílulas</option><option value="grade">Grade</option><option value="periodos">Por período</option><option value="lista">Lista</option><option value="trilho">Trilho horizontal</option></select></label></section><div class="barra-fixa"><button class="btn" type="submit">Salvar aparência</button><button class="btn ghost" type="button" id="descartar">Descartar</button></div></form></div>
<aside class="card prev pv" id="prev" hidden><div class="pbar"><strong class="ptit">Pré-visualização</strong><span class="pctl"><select id="vmodo" aria-label="Visão"><option value="cliente">Cliente</option><option value="loja">Loja</option></select><select id="vtela" aria-label="Tela"></select><select id="vdisp" aria-label="Dispositivo"><option value="390">Celular</option><option value="820">Tablet</option><option value="100%" selected>Computador</option></select></span>

<template id="t-master"><h1>Plataforma</h1><div class="cols"><section class="card"><h2>Estabelecimentos</h2><div class="skel" id="carga"></div><ul class="lista" id="lista"></ul></section><div><form class="card" id="nova"><h2>Novo estabelecimento</h2><label>Nome<input name="nome" required></label><label>Endereço (id)<input name="id_" placeholder="barbearia-do-ze" required></label><label>Cor principal<input name="cor" type="color" value="#23395b"></label><button class="btn">Criar</button></form><br><form class="card" id="dono"><h2>Vincular proprietário</h2><label>Estabelecimento<select id="sel"></select></label><label>E-mail da conta<input name="email" type="email" required></label><button class="btn">Vincular</button></form></div></div></template>
<template id="t-avaliacoes"><h1>Avaliações</h1><p class="lead" id="media"></p><ul class="lista card" id="lista"></ul></template>
<template id="t-indicadores"><h1>Indicadores</h1><div class="cols"><label>Unidade<select id="un"><option value="">Todas</option></select></label><label>De<input id="de" type="date"></label><label>Até<input id="ate" type="date"></label></div><p><button class="btn ghost" id="csv">Exportar CSV</button></p><div class="cols" id="kpis"></div><div class="cols"><div class="card"><div id="c1" class="graf"></div></div><div class="card"><div id="c2" class="graf"></div></div></div><section class="card" style="margin-top:1rem"><h2>Profissionais e comissões</h2><ul class="lista" id="prof"></ul></section></template>
<template id="t-ajustes"><h1>Ajustes da loja</h1><div class="cols"><form class="card" id="fid"><h2>Programa de fidelidade</h2><p class="mute">Quando ativo, o cliente acompanha o progresso e ganha um brinde automático.</p><label><input type="checkbox" name="ativo">Ativar para os clientes</label><label>Brinde a cada quantos atendimentos concluídos<input name="meta" type="number" min="2" value="10"></label><label>Nome do brinde<input name="brinde" maxlength="40" placeholder="Ex.: corte grátis"></label><button class="btn">Salvar</button></form>
<form class="card" id="ind"><h2>Indicação de amigos</h2><p class="mute">O cliente que indicar ganha carimbos quando o indicado concluir o primeiro atendimento.</p><label><input type="checkbox" name="ativo">Ativar indicações</label><label>Carimbos de bônus para quem indica<input name="bonus" type="number" min="1" value="1"></label><button class="btn">Salvar</button></form><form class="card" id="plf"><h2>Planos e pacotes</h2><p class="mute">Quando ativo, os clientes veem os planos na tela inicial e na área de agendamento e podem solicitar a contratação.</p><label><input type="checkbox" name="ativo">Oferecer planos aos clientes</label><button class="btn">Salvar</button></form><form class="card" id="pol"><h2>Cancelamento</h2><label>Antecedência mínima para o cliente cancelar (horas; 0 = livre)<input name="horas" type="number" min="0" value="0"></label><button class="btn">Salvar</button></form><form class="card" id="txt"><h2>Textos do agendamento</h2><p class="mute">Personalize a pergunta de cada etapa. Em branco, vale o texto padrão.</p><label>Etapa da unidade<input name="tu" maxlength="60"></label><label>Etapa do profissional<input name="tp" maxlength="60"></label><label>Etapa do serviço<input name="ts" maxlength="60"></label><label>Etapa da data<input name="td" maxlength="60"></label><label>Etapa do horário<input name="th" maxlength="60"></label><button class="btn">Salvar</button></form></div></template>
<template id="t-bloqueios"><h1>Bloqueios de agenda</h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"><h2>Novo bloqueio</h2><label>Unidade<select name="unidadeId"></select></label><label>Profissional<select name="profId"></select></label><div class="cols"><label>Data<input name="data" type="date" required></label><label>Até (opcional)<input name="fim" type="date"></label></div><label><input type="checkbox" name="todo" checked>Dia inteiro</label><div class="cols"><label>Das<input name="de" type="time"></label><label>Às<input name="ate" type="time"></label></div><button class="btn">Bloquear</button></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-promocoes"><h1>Promoções e avisos</h1><div class="cols pr"><div><form class="card" id="f"><h2>Nova promoção ou cupom</h2><label>Título<input name="titulo" maxlength="60" required></label><label>Descrição<input name="descricao" maxlength="140"></label><div class="cols"><label>Tipo<select name="tipo"><option value="percent">Percentual (%)</option><option value="valor">Valor fixo (R$)</option></select></label><label>Desconto<input name="valor" type="number" min="0" step="any" required></label></div><div class="cols"><label>Código do cupom (opcional)<input name="codigo" maxlength="20"></label><label>Válida até<input name="validade" type="date"></label></div><label>Só para este cliente (e-mail, opcional)<input name="email" type="email"></label><label><input type="checkbox" name="home">Destacar na tela inicial</label><button class="btn">Criar</button></form><ul class="lista card" id="lista" style="margin-top:1rem"></ul></div>
<div><form class="card" id="fa"><h2>Novo aviso aos clientes</h2><label>Título<input name="titulo" maxlength="80" required></label><label>Mensagem<textarea name="texto" rows="3" maxlength="300" required></textarea></label><button class="btn">Publicar aviso</button></form><ul class="lista card" id="lavisos" style="margin-top:1rem"></ul></div></div></template>
<template id="t-metas"><div class="pg-head"><h1>Metas e remuneração</h1><div class="dnav"><select id="un" aria-label="Unidade" style="width:auto;margin:0"><option value="">Todas as unidades</option></select><label class="dnav">Mês<input id="mes" type="month"></label></div></div><div class="cols pr"><div><form class="card" id="f"><h2>Nova meta</h2><label>Quem<select name="profId"></select></label><label>Mês<input name="mes" type="month" required></label><div class="cols"><label>Faturamento (R$)<input name="valor" type="number" min="0" step="any"></label><label>Atendimentos<input name="atend" type="number" min="0"></label></div><label>Bônus ao bater a meta (R$)<input name="bonus" type="number" min="0" step="any"></label><button class="btn">Criar meta</button></form></div><div><ul class="lista card" id="lista"></ul><h2 style="margin-top:1.5rem">Remuneração do mês</h2><ul class="lista card" id="rem"></ul></div></div></template>
<template id="t-equipe"><h1>Equipe e permissões</h1><label id="ljw" hidden>Estabelecimento<select id="lj"></select></label><div class="cols pr"><form class="card" id="fc"><h2>Adicionar usuário</h2><label>E-mail<input name="email" type="email" required></label><label>Tipo<select name="papel"><option value="equipe">Usuário da loja</option><option value="proprietario">Administrador</option></select></label><div id="fcu"></div><button class="btn">Convidar</button><p class="mute" style="margin-top:.8rem">A pessoa precisa entrar no app com este e-mail (criando a conta, se ainda não tiver). Administradores veem tudo; usuários da loja veem só as unidades e telas liberadas aqui.</p></form><div><ul class="lista card" id="lista"></ul><h2 style="margin-top:1.5rem">Convites pendentes</h2><ul class="lista card" id="lconv"></ul></div></div></template>
<template id="t-clientes"><h1>Clientes</h1><div class="dnav" style="margin-bottom:1rem"><input id="busca" placeholder="Buscar por nome ou telefone" aria-label="Buscar cliente" style="flex:1"><select id="risco" aria-label="Filtro" style="width:auto;margin:0"><option value="0">Todos</option><option value="30">Sem voltar há 30+ dias</option><option value="60">Sem voltar há 60+ dias</option><option value="90">Sem voltar há 90+ dias</option><option value="aniv">Aniversariantes do mês</option></select></div><ul class="lista card" id="lista"></ul></template>
<template id="t-financeiro"><div class="pg-head"><h1>Financeiro</h1><div class="dnav"><input id="mes" type="month" aria-label="Mês"><button class="btn ghost sm" id="csv" type="button">Exportar CSV</button></div></div><div class="kpis" id="kpis"></div><div class="cols pr"><div><form class="card" id="f"><h2>Registrar despesa</h2><label>Descrição<input name="descricao" maxlength="80" required></label><div class="cols"><label>Categoria<select name="categoria"><option>Aluguel</option><option>Produtos</option><option>Salários</option><option>Contas</option><option>Marketing</option><option>Outros</option></select></label><label>Valor (R$)<input name="valor" type="number" min="0" step="any" required></label></div><label>Data<input name="data" type="date" required></label><button class="btn">Registrar</button></form></div><div><h2>Recebido por forma</h2><ul class="lista card" id="formas"></ul><h2 style="margin-top:1.5rem">Despesas do mês</h2><ul class="lista card" id="lista"></ul></div></div></template>
<template id="t-planos"><h1 id="tit"></h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"></form><ul class="lista card" id="lista"></ul></div></template>
<template id="t-assinaturas"><h1>Pacotes vendidos</h1><p class="lead" style="margin-bottom:1rem">Confirme o pagamento recebido para ativar o pacote do cliente. Ao concluir um atendimento, escolha "Pacote" para descontar uma sessão.</p><ul class="lista card" id="lista"></ul></template>
<template id="t-produtos"><h1 id="tit"></h1><div class="skel" id="carga"></div><div class="crud"><form class="card" id="f"></form><ul class="lista card" id="lista"></ul></div></template>
</body></html>
