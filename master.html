<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plataforma</title>
<link rel="stylesheet" href="css/style.css"><script type="module" src="js/app.js"></script></head>
<body data-page="master"><div class="pole" aria-hidden="true"></div><header class="topo" id="topo"></header>
<main class="wrap" id="main">
<h1>Plataforma</h1><div class="cols"><section class="card"><h2>Estabelecimentos</h2><div class="skel" id="carga"></div><ul class="lista" id="lista"></ul></section><div><form class="card" id="nova"><h2>Novo estabelecimento</h2><label>Nome<input name="nome" required></label><label>Endereço (id)<input name="id_" placeholder="barbearia-do-ze" required></label><label>Cor principal<input name="cor" type="color" value="#23395b"></label><button class="btn">Criar</button></form><br><form class="card" id="dono"><h2>Vincular proprietário</h2><label>Estabelecimento<select id="sel"></select></label><label>E-mail da conta<input name="email" type="email" required></label><button class="btn">Vincular</button></form></div></div>
</main><div id="toasts" aria-live="polite"></div></body></html>
