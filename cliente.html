<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil</title>
<link rel="stylesheet" href="css/style.css"><script type="module" src="js/app.js"></script></head>
<body data-page="cliente"><div class="pole" aria-hidden="true"></div><header class="topo" id="topo"></header>
<main class="wrap" id="main">
<h1>Meu perfil</h1><div class="skel" id="carga"></div><form id="f" class="card" hidden><p class="mute">Todos os campos são opcionais. Você pode alterar ou apagar quando quiser.</p><div class="cols"><label>Nome<input name="nome"></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel"></label><label>Nascimento<input name="nascimento" type="date"></label><label>CPF<input name="cpf" inputmode="numeric"></label><label>CEP<input name="cep" inputmode="numeric" autocomplete="postal-code"></label><label>Endereço<input name="endereco" autocomplete="street-address"></label></div><label>Estilos e preferências<textarea name="estilo" rows="3" placeholder="Ex.: degradê baixo, barba alinhada, sem máquina na tesoura"></textarea></label><button class="btn">Salvar perfil</button></form>
</main><div id="toasts" aria-live="polite"></div></body></html>
