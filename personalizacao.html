<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personalização</title>
<link rel="stylesheet" href="css/style.css"><script type="module" src="js/app.js"></script></head>
<body data-page="personalizacao"><div class="pole" aria-hidden="true"></div><header class="topo" id="topo"></header>
<main class="wrap" id="main">
<h1>Personalização</h1><p class="lead">As mudanças aparecem na hora. Salve para publicar na sua página.</p><div class="skel" id="carga"></div><form id="f" class="card" hidden><div class="cols"><label>Nome<input name="nome" required></label><label>Cor principal<input name="cor" type="color"></label><label>Tema<select name="tema"><option value="claro">Claro</option><option value="escuro">Escuro</option></select></label><label>Formato dos componentes<select name="estilo"><option value="reto">Reto</option><option value="suave">Suave</option><option value="redondo">Redondo</option></select></label></div><label>Descrição<textarea name="descricao" rows="2"></textarea></label><button class="btn" type="submit">Salvar alterações</button> <button class="btn ghost" type="button" id="descartar">Descartar</button></form>
</main><div id="toasts" aria-live="polite"></div></body></html>
