<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta</title>
<link rel="stylesheet" href="css/style.css"><script type="module" src="js/app.js"></script></head>
<body data-page="cadastro"><div class="pole" aria-hidden="true"></div><header class="topo" id="topo"></header>
<main class="wrap" id="main">
<section class="card auth"><h1>Criar conta</h1><form id="f"><label>Nome<input name="nome" autocomplete="name" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="senha" type="password" minlength="6" autocomplete="new-password" required></label><label><input type="checkbox" name="lgpd">Aceito que meus dados sejam usados para agendamentos e atendimento.</label><button class="btn">Criar conta</button></form><button class="btn ghost" id="g" type="button">Continuar com Google</button><p class="mute">Já tem conta? <a data-l="login.html">Entrar</a></p></section>
</main><div id="toasts" aria-live="polite"></div></body></html>
